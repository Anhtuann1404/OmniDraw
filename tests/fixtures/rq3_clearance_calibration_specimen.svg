<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <!-- OmniDraw TV3 RQ3 Physical Calibration & Clearance Specimen Fixture -->
  <!-- Khung can toa do A4 (Boundary Verification) -->
  <path d="M 10 10 L 287 10 L 287 200 L 10 200 Z" fill="none" stroke="#000000" stroke-width="0.4" id="boundary_frame" />

  <!-- ====================================================================== -->
  <!-- KHOI D: Thuoc do kiem chuan quang hoc 50.0mm & O vuong 20.0x20.0mm    -->
  <!-- ====================================================================== -->
  <g id="block_d_calibration_bars">
    <!-- Thuoc do 50mm ngang tai (20, 25) -->
    <path d="M 20 25 L 70 25 M 20 22 L 20 28 M 70 22 L 70 28" fill="none" stroke="#000000" stroke-width="0.5" id="calib_bar_50mm_x" />
    <text x="35" y="22" font-family="sans-serif" font-size="3" fill="#000000">50.0 mm</text>

    <!-- Thuoc do 50mm doc tai (20, 35) -->
    <path d="M 20 35 L 20 85 M 17 35 L 23 35 M 17 85 L 23 85" fill="none" stroke="#000000" stroke-width="0.5" id="calib_bar_50mm_y" />

    <!-- O vuong kiem chuan 20x20mm tai (35, 45) -->
    <path d="M 35 45 L 55 45 L 55 65 L 35 65 Z" fill="none" stroke="#000000" stroke-width="0.5" id="calib_square_20mm" />
    <text x="38" y="56" font-family="sans-serif" font-size="2.5" fill="#000000">20x20mm</text>
  </g>

  <!-- ====================================================================== -->
  <!-- KHOI A: Thang khoang ho dau thanh (Diacritic Clearance Ladder)          -->
  <!-- Danh sach khoang ho: 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70 mm       -->
  <!-- ====================================================================== -->
  <g id="block_a_clearance_ladder">
    <text x="90" y="22" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#000000">BLOCK A: DIACRITIC CLEARANCE LADDER (0.10mm - 0.70mm)</text>

    <!-- Cap 1: d = 0.10 mm (Y = 30.00 va Y = 30.10) -->
    <path d="M 90 30.00 L 170 30.00 M 90 30.10 L 170 30.10" fill="none" stroke="#000000" stroke-width="0.3" id="clearance_0_10mm" />
    <text x="175" y="30.5" font-family="sans-serif" font-size="2.2" fill="#000000">d = 0.10 mm</text>

    <!-- Cap 2: d = 0.20 mm (Y = 38.00 va Y = 38.20) [Technical Minimum] -->
    <path d="M 90 38.00 L 170 38.00 M 90 38.20 L 170 38.20" fill="none" stroke="#000000" stroke-width="0.3" id="clearance_0_20mm" />
    <text x="175" y="38.5" font-family="sans-serif" font-size="2.2" fill="#000000">d = 0.20 mm (Technical Min)</text>

    <!-- Cap 3: d = 0.30 mm (Y = 46.00 va Y = 46.30) -->
    <path d="M 90 46.00 L 170 46.00 M 90 46.30 L 170 46.30" fill="none" stroke="#000000" stroke-width="0.3" id="clearance_0_30mm" />
    <text x="175" y="46.5" font-family="sans-serif" font-size="2.2" fill="#000000">d = 0.30 mm</text>

    <!-- Cap 4: d = 0.40 mm (Y = 54.00 va Y = 54.40) -->
    <path d="M 90 54.00 L 170 54.00 M 90 54.40 L 170 54.40" fill="none" stroke="#000000" stroke-width="0.3" id="clearance_0_40mm" />
    <text x="175" y="54.5" font-family="sans-serif" font-size="2.2" fill="#000000">d = 0.40 mm</text>

    <!-- Cap 5: d = 0.50 mm (Y = 62.00 va Y = 62.50) [Provisional Target] -->
    <path d="M 90 62.00 L 170 62.00 M 90 62.50 L 170 62.50" fill="none" stroke="#000000" stroke-width="0.3" id="clearance_0_50mm" />
    <text x="175" y="62.5" font-family="sans-serif" font-size="2.2" fill="#000000">d = 0.50 mm (Target)</text>

    <!-- Cap 6: d = 0.60 mm (Y = 70.00 va Y = 70.60) -->
    <path d="M 90 70.00 L 170 70.00 M 90 70.60 L 170 70.60" fill="none" stroke="#000000" stroke-width="0.3" id="clearance_0_60mm" />
    <text x="175" y="70.5" font-family="sans-serif" font-size="2.2" fill="#000000">d = 0.60 mm</text>

    <!-- Cap 7: d = 0.70 mm (Y = 78.00 va Y = 78.70) -->
    <path d="M 90 78.00 L 170 78.00 M 90 78.70 L 170 78.70" fill="none" stroke="#000000" stroke-width="0.3" id="clearance_0_70mm" />
    <text x="175" y="78.5" font-family="sans-serif" font-size="2.2" fill="#000000">d = 0.70 mm</text>
  </g>

  <!-- ====================================================================== -->
  <!-- KHOI B: Kiem tra goc be cua ngat net (Kinematic Turn & Acute Angles)    -->
  <!-- Cac goc bẻ theo heading change theta_turn in {60, 90, 120, 150} deg    -->
  <!-- Do dai moi doan L = 20.0 mm                                            -->
  <!-- ====================================================================== -->
  <g id="block_b_acute_turns">
    <text x="20" y="105" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#000000">BLOCK B: ACUTE TURNS &amp; CORNERING VIBRATION (L=20.0mm)</text>

    <!-- Goc be 60 do: P0(20, 135) -> P1(40, 135) -> P2(50.00, 117.68) [Heading: 60.00 deg, Interior: 120.00 deg] -->
    <path d="M 20 135 L 40 135 L 50.00 117.68" fill="none" stroke="#000000" stroke-width="0.5" id="turn_60deg" />
    <text x="20" y="142" font-family="sans-serif" font-size="2.2" fill="#000000">Turn 60° (Heading 60°, Interior 120°)</text>

    <!-- Goc be 90 do: P0(75, 135) -> P1(95, 135) -> P2(95.00, 115.00) [Heading: 90.00 deg, Interior: 90.00 deg] -->
    <path d="M 75 135 L 95 135 L 95.00 115.00" fill="none" stroke="#000000" stroke-width="0.5" id="turn_90deg" />
    <text x="75" y="142" font-family="sans-serif" font-size="2.2" fill="#000000">Turn 90° (Heading 90°, Interior 90°)</text>

    <!-- Goc be 120 do (Nguong kiem tra H3.2): P0(130, 135) -> P1(150, 135) -> P2(140.00, 117.68) [Heading: 120.00 deg, Interior: 60.00 deg] -->
    <path d="M 130 135 L 150 135 L 140.00 117.68" fill="none" stroke="#000000" stroke-width="0.5" id="turn_120deg" />
    <text x="130" y="142" font-family="sans-serif" font-size="2.2" fill="#000000">Turn 120° (Heading 120°, Interior 60° - H3.2)</text>

    <!-- Goc be 150 do: P0(185, 135) -> P1(205, 135) -> P2(187.68, 125.00) [Heading: 150.00 deg, Interior: 30.00 deg] -->
    <path d="M 185 135 L 205 135 L 187.68 125.00" fill="none" stroke="#000000" stroke-width="0.5" id="turn_150deg" />
    <text x="185" y="142" font-family="sans-serif" font-size="2.2" fill="#000000">Turn 150° (Heading 150°, Interior 30°)</text>
  </g>

  <!-- ====================================================================== -->
  <!-- KHOI C: Tan suat nhac ha but truc Z (Rapid Pen-Lift Actuation)          -->
  <!-- 20 chu ky: 2.0mm ve / 2.0mm nhac but (Pitch = 4.0mm)                   -->
  <!-- 3 dai van toc: 20 mm/s, 40 mm/s, 60 mm/s                               -->
  <!-- ====================================================================== -->
  <g id="block_c_rapid_pen_lift">
    <text x="20" y="165" font-family="sans-serif" font-size="3.5" font-weight="bold" fill="#000000">BLOCK C: RAPID PEN-LIFT ACTUATION (2.0mm Draw / 2.0mm Lift - 3 Speed Bands)</text>

    <!-- Band 1: 20 mm/s tai Y = 172 -->
    <path d="M 25 172 L 27 172 M 29 172 L 31 172 M 33 172 L 35 172 M 37 172 L 39 172 M 41 172 L 43 172 M 45 172 L 47 172 M 49 172 L 51 172 M 53 172 L 55 172 M 57 172 L 59 172 M 61 172 L 63 172 M 65 172 L 67 172 M 69 172 L 71 172 M 73 172 L 75 172 M 77 172 L 79 172 M 81 172 L 83 172 M 85 172 L 87 172 M 89 172 L 91 172 M 93 172 L 95 172 M 97 172 L 99 172 M 101 172 L 103 172" fill="none" stroke="#000000" stroke-width="0.4" id="rapid_pen_lift_20mms" />
    <text x="110" y="173" font-family="sans-serif" font-size="2.2" fill="#000000">Band 1: v=20 mm/s (20 lifts, 2mm draw / 2mm lift)</text>

    <!-- Band 2: 40 mm/s tai Y = 180 -->
    <path d="M 25 180 L 27 180 M 29 180 L 31 180 M 33 180 L 35 180 M 37 180 L 39 180 M 41 180 L 43 180 M 45 180 L 47 180 M 49 180 L 51 180 M 53 180 L 55 180 M 57 180 L 59 180 M 61 180 L 63 180 M 65 180 L 67 180 M 69 180 L 71 180 M 73 180 L 75 180 M 77 180 L 79 180 M 81 180 L 83 180 M 85 180 L 87 180 M 89 180 L 91 180 M 93 180 L 95 180 M 97 180 L 99 180 M 101 180 L 103 180" fill="none" stroke="#000000" stroke-width="0.4" id="rapid_pen_lift_40mms" />
    <text x="110" y="181" font-family="sans-serif" font-size="2.2" fill="#000000">Band 2: v=40 mm/s (20 lifts, 2mm draw / 2mm lift)</text>

    <!-- Band 3: 60 mm/s tai Y = 188 -->
    <path d="M 25 188 L 27 188 M 29 188 L 31 188 M 33 188 L 35 188 M 37 188 L 39 188 M 41 188 L 43 188 M 45 188 L 47 188 M 49 188 L 51 188 M 53 188 L 55 188 M 57 188 L 59 188 M 61 188 L 63 188 M 65 188 L 67 188 M 69 188 L 71 188 M 73 188 L 75 188 M 77 188 L 79 188 M 81 188 L 83 188 M 85 188 L 87 188 M 89 188 L 91 188 M 93 188 L 95 188 M 97 188 L 99 188 M 101 188 L 103 188" fill="none" stroke="#000000" stroke-width="0.4" id="rapid_pen_lift_60mms" />
    <text x="110" y="189" font-family="sans-serif" font-size="2.2" fill="#000000">Band 3: v=60 mm/s (20 lifts, 2mm draw / 2mm lift)</text>
  </g>
</svg>
